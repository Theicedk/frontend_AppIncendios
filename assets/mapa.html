<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Mapa Focos</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { padding: 0; margin: 0; }
        html, body, #map { height: 100%; width: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        // Inicializamos el mapa en coordenadas de Chile (Santiago)
        var map = L.map('map').setView([-33.45694, -70.64827], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Definimos un icono rojo personalizado para los focos
        var redIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        // Estilización de marcador azul para la selección temporal del usuario
        var blueIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        // Variable para rastrear el marcador seleccionado y no crear múltiples pines
        var marcadorTemporal = null;

        function despacharCoordenadas(lat, lng) {
            var mensaje = JSON.stringify({ tipo: 'NUEVA_UBICACION', lat: lat, lng: lng });
            // Native: ReactNativeWebView postMessage
            if (window.ReactNativeWebView) {
                window.ReactNativeWebView.postMessage(mensaje);
            }
            // Web: postMessage al parent (iframe)
            if (window.parent && window.parent !== window) {
                window.parent.postMessage(JSON.parse(mensaje), '*');
            }
        }

        // Función global para ser llamada desde React Native (injectJavaScript)
        window.agregarFocos = function(jsonString) {
            try {
                var focos = JSON.parse(jsonString);
                focos.forEach(function(foco) {
                    var marker = L.marker([foco.latitud, foco.longitud], { icon: redIcon }).addTo(map);
                    marker.bindPopup("<b>Foco #" + foco.id + "</b><br>Estado: " + foco.estado);
                });
            } catch (e) {
                console.error("Error procesando los focos:", e);
            }
        };

        // Variable global para guardar nuestro punto azul y no crear infinitos puntos
        let marcadorUsuario = null;

        function actualizarPuntoAzul(lat, lng) {
            if (marcadorUsuario) {
                marcadorUsuario.setLatLng([lat, lng]);
            } else {
                marcadorUsuario = L.circleMarker([lat, lng], {
                    color: '#FFFFFF',
                    fillColor: '#007AFF',
                    fillOpacity: 1,
                    weight: 3,
                    radius: 8
                }).addTo(map);
            }
        }

        // Escuchar mensajes del padre (web) para comandos remotos
        window.addEventListener('message', function(event) {
            var data = event.data;
            if (!data || !data.type) return;
            switch (data.type) {
                case 'AGREGAR_FOCOS':
                    if (data.payload) window.agregarFocos(data.payload);
                    break;
                case 'ACTUALIZAR_GPS':
                    if (data.lat != null && data.lng != null) actualizarPuntoAzul(data.lat, data.lng);
                    break;
            }
        });

        // Evento táctil de clic para dibujar pin temporal y despachar coordenadas
        map.on('click', function(e) {
            if (marcadorTemporal) {
                marcadorTemporal.setLatLng(e.latlng);
            } else {
                marcadorTemporal = L.marker(e.latlng, { icon: blueIcon }).addTo(map);
                marcadorTemporal.bindPopup("<b>Ubicación seleccionada</b><br>Aquí se creará tu reporte.").openPopup();
            }
            despacharCoordenadas(e.latlng.lat, e.latlng.lng);
        });
    </script>
</body>
</html>
