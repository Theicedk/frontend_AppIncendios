<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Mapa Focos</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { padding: 0; margin: 0; }
        html, body, #map { height: 100%; width: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        // Inicializamos el mapa en coordenadas de Chile (Santiago)
        var map = L.map('map').setView([-33.45694, -70.64827], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Definimos un icono rojo personalizado para los focos
        var redIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        // Función global para ser llamada desde React Native
        window.agregarFocos = function(jsonString) {
            try {
                var focos = JSON.parse(jsonString);
                focos.forEach(function(foco) {
                    var marker = L.marker([foco.latitud, foco.longitud], { icon: redIcon }).addTo(map);
                    marker.bindPopup("<b>Foco #" + foco.id + "</b><br>Estado: " + foco.estado);
                });
            } catch (e) {
                console.error("Error procesando los focos:", e);
            }
        };

        // Evento de click para enviar coordenadas a React Native
        map.on('click', function(e) {
            if (window.ReactNativeWebView) {
                window.ReactNativeWebView.postMessage(JSON.stringify({
                    tipo: 'NUEVA_UBICACION',
                    lat: e.latlng.lat,
                    lng: e.latlng.lng
                }));
            }
        });
    </script>
</body>
</html>
